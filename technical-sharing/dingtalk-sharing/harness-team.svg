<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1200" height="600" rx="24" fill="#f8fafc"/><text x="600" y="58" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="30" font-weight="700" fill="#0f172a">从个人 Harness 到团队知识系统</text><g font-family="Arial,Microsoft YaHei" text-anchor="middle"><rect x="90" y="150" width="250" height="100" rx="18" fill="#dbeafe"/><text x="215" y="195" font-size="24" fill="#1e3a8a">个人代码</text><text x="215" y="228" font-size="18" fill="#334155">我的知识 / 我的 AI</text><rect x="475" y="150" width="250" height="100" rx="18" fill="#ede9fe"/><text x="600" y="195" font-size="24" fill="#5b21b6">共享知识库</text><text x="600" y="228" font-size="18" fill="#334155">按范围审核共享</text><rect x="860" y="150" width="250" height="100" rx="18" fill="#dcfce7"/><text x="985" y="195" font-size="24" fill="#166534">多个项目</text><text x="985" y="228" font-size="18" fill="#334155">按项目隔离规则</text><path d="M340 200h120M730 200h120" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="380" width="900" height="90" rx="18" fill="#fef3c7"/><text x="600" y="420" font-size="23" fill="#92400e">不是把所有内容同步，而是让知识具备范围、状态和生命周期</text><text x="600" y="452" font-size="18" fill="#78350f">通用知识可复用 · 项目规则隔离 · 候选经验不能直接升级为稳定规则</text></g></svg>
