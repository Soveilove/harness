<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs>
<rect width="1400" height="760" rx="24" fill="#f8fafc"/>
<text x="700" y="54" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="30" font-weight="700" fill="#0f172a">PRD 到前后端联合交付</text>
<text x="700" y="90" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="18" fill="#64748b">统一契约、双轨执行、按业务切片持续汇合</text>
<g font-family="Arial,Microsoft YaHei" text-anchor="middle">
  <rect x="70" y="145" width="220" height="92" rx="16" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <text x="180" y="184" font-size="23" font-weight="700" fill="#1e3a8a">PRD</text>
  <text x="180" y="215" font-size="17" fill="#1e3a8a">用户目标与验收场景</text>
  <rect x="380" y="145" width="270" height="92" rx="16" fill="#ede9fe" stroke="#c4b5fd" stroke-width="2"/>
  <text x="515" y="184" font-size="23" font-weight="700" fill="#5b21b6">共同契约</text>
  <text x="515" y="215" font-size="17" fill="#5b21b6">API、状态、边界、异常</text>
  <rect x="740" y="145" width="270" height="92" rx="16" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <text x="875" y="184" font-size="23" font-weight="700" fill="#92400e">垂直业务切片</text>
  <text x="875" y="215" font-size="17" fill="#92400e">创建、查询、编辑、异常</text>
  <path d="M290 191h80M650 191h80" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="170" y="315" width="430" height="190" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="385" y="355" font-size="23" font-weight="700" fill="#1e3a8a">前端轨道</text>
  <text x="385" y="395" font-size="18" fill="#1e3a8a">Mock 数据</text>
  <text x="385" y="430" font-size="18" fill="#1e3a8a">页面状态与交互</text>
  <text x="385" y="465" font-size="18" fill="#1e3a8a">成功、失败、加载、空态</text>
  <rect x="800" y="315" width="430" height="190" rx="20" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="2"/>
  <text x="1015" y="355" font-size="23" font-weight="700" fill="#166534">后端轨道</text>
  <text x="1015" y="395" font-size="18" fill="#166534">API 与契约测试</text>
  <text x="1015" y="430" font-size="18" fill="#166534">领域规则与数据变化</text>
  <text x="1015" y="465" font-size="18" fill="#166534">权限、幂等、兼容路径</text>
  <path d="M875 237v45H385v25M875 237v45h140v25" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="440" y="575" width="250" height="82" rx="16" fill="#ffedd5" stroke="#fdba74" stroke-width="2"/>
  <text x="565" y="610" font-size="22" font-weight="700" fill="#9a3412">按切片汇合</text>
  <text x="565" y="637" font-size="16" fill="#9a3412">真实接口 + 真实交互</text>
  <rect x="760" y="575" width="250" height="82" rx="16" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <text x="885" y="610" font-size="22" font-weight="700" fill="#166534">verify</text>
  <text x="885" y="637" font-size="16" fill="#166534">产品与技术证据</text>
  <path d="M385 505v42h180v28M1015 505v42H565v28M690 616h50" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
</g>
<path d="M1010 616h200" stroke="#f97316" stroke-width="3" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
<text x="1205" y="604" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="16" fill="#c2410c">发现偏差</text>
<text x="700" y="715" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="18" fill="#475569">当前 CLI 已能编排阶段、任务、汇合和验证；契约自动校验、泳道调度和 Mock 生成仍需约定或后续开发</text>
</svg>

