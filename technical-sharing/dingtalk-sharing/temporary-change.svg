<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><rect width="1200" height="620" rx="24" fill="#f8fafc"/><text x="55" y="58" font-family="Arial,Microsoft YaHei" font-size="30" font-weight="700" fill="#0f172a">临时需求：系统同时存在三种状态</text><g font-family="Arial,Microsoft YaHei" text-anchor="middle"><rect x="70" y="150" width="290" height="170" rx="18" fill="#dbeafe"/><text x="215" y="205" font-size="24" fill="#1e3a8a">原始目标</text><text x="215" y="250" font-size="20" fill="#334155">完整切换到新模块</text><rect x="455" y="150" width="290" height="170" rx="18" fill="#fef3c7"/><text x="600" y="205" font-size="24" fill="#92400e">临时决策</text><text x="600" y="250" font-size="20" fill="#334155">新模块风险高，暂不上线</text><rect x="840" y="150" width="290" height="170" rx="18" fill="#dcfce7"/><text x="985" y="205" font-size="24" fill="#166534">当前执行</text><text x="985" y="250" font-size="20" fill="#334155">旧模块同步部分新规则</text></g><path d="M360 235h85M745 235h85" stroke="#64748b" stroke-width="4" marker-end="url(#a)"/><rect x="150" y="410" width="900" height="100" rx="18" fill="#fee2e2"/><text x="600" y="452" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="23" fill="#991b1b">如果 AI 继续读取旧 Spec，就会非常正确地执行错误的事情</text><text x="600" y="485" text-anchor="middle" font-family="Arial,Microsoft YaHei" font-size="18" fill="#7f1d1d">需要：基线、状态、变更失效关系被显式管理</text></svg>
