lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    dependencies:
      '@soveilove/sovei':
        specifier: file:packages/sovei-core
        version: file:packages/sovei-core

packages:

  '@soveilove/sovei@file:packages/sovei-core':
    resolution: {directory: packages/sovei-core, type: directory}
    engines: {node: '>=20'}
    hasBin: true

snapshots:

  '@soveilove/sovei@file:packages/sovei-core': {}
