# 项目声明 — 声明当前 harness 绑定的项目
# 换项目时：修改本文件 + 按"料文件清单"清空对应文件内容(保留模板格式) + 重新积累

project:
  name: pino-front
  description: Pino Front AI 创作平台 (Vue 3 + TypeScript + Pinia)
  tech_stack:
    framework: Vue 3
    language: TypeScript
    state: Pinia
    build: Vite
    terminal: Git Bash
  started: 2026-05-12

# 壳文件(项目无关，换项目不动):
#   harness/workflows/*         工作流定义
#   harness/templates/*         文档模板
#   harness/scripts/*           sync 和工程脚本
#   harness/ide-adapters/*      IDE 适配注册
#   harness/extensions/*        SpecKit 扩展
#   harness/integrations/*      集成清单
#   .agents/skills/*            skill (knowledge-loader/sovei-workflow/distill)
#   .codebuddy/skills/*         skill 副本
#   .codebuddy/commands/*       命令文件
#   .trae/skills/*              skill 副本
#   packages/sovei-system/*     中枢 package

# 料文件(项目专属，换项目清空重填):
#   格式: 文件路径 | 内容类型 | 换项目操作
project_files:
  # --- memory/ 知识库 ---
  - path: project/memory/MEMORY.md
    type: 索引
    action: 清空条目，保留骨架格式
  - path: project/memory/constitution.md
    type: 宪法(混合)
    action: 保留原则 I-V(壳)，清空 Vue 开发标准 VI-VII(料)
  - path: project/memory/user-preferences.md
    type: 偏好(混合)
    action: 保留编码风格(壳)，清空环境约束段(料)
  - path: project/memory/vue-pitfalls.md
    type: 踩坑库
    action: 整个文件清空，保留模板格式
  - path: project/memory/project-architecture.md
    type: 架构文档
    action: 整个文件清空，保留模板格式
  - path: project/memory/design-decisions.md
    type: ADR
    action: 清空条目，保留模板格式
  - path: project/memory/design-tools.md
    type: 设计工具
    action: 整个文件清空(项目可能不用 Figma)
  - path: project/memory/figma-config.md
    type: Figma 配置
    action: 整个文件清空(项目可能不用 Figma)
  - path: project/memory/canvas-generate-button-reuse.md
    type: 功能知识
    action: 删除(Pino Front 专属功能)
  - path: project/memory/canvas-share-detail-modal.md
    type: 功能知识
    action: 删除(Pino Front 专属功能)
  - path: project/memory/image-details-loading-optimization.md
    type: 功能知识
    action: 删除(Pino Front 专属功能)
  # --- codegraph/ 代码地图 ---
  - path: project/codegraph/index.md
    type: 索引
    action: 清空条目，保留骨架
  - path: project/codegraph/recent-work-code-map.md
    type: 代码地图
    action: 删除(Pino Front 专属)
  - path: project/codegraph/board-code-map.md
    type: 代码地图
    action: 删除(Pino Front 专属)
  - path: project/codegraph/board-video-code-map.md
    type: 代码地图
    action: 删除(Pino Front 专属)
  # --- spec-harness/ 规则库 ---
  - path: project/rules/implementation-rules.md
    type: 规则
    action: 清空 R-001~R-006，保留模板格式
  - path: project/rules/rejected-patterns.md
    type: 失败记录
    action: 清空 RP-001，保留模板格式
  - path: project/rules/pending-rules.md
    type: 候选规则
    action: 通常为空，无需处理
  - path: spec-harness/failure-taxonomy.md
    type: 分类法
    action: 前端项目通用，非前端项目需替换分类法
  # --- IDE 规则 ---
  - path: .codebuddy/rules/core-constraints/RULE.mdc
    type: IDE 规则(混合)
    action: 保留架构原则(壳)，清空 Vue 红线 + 环境约束(料)
  - path: .codebuddy/project/memory/MEMORY.md
    type: IDE 记忆
    action: 清空(CodeBuddy 对话总结)

# 壳文件(项目无关，换项目保留):
shell_files:
  - workflows/USAGE.md
  - workflows/systematic-debugging.md
  - workflows/workflow-registry.json
  - workflows/sovei/*
  - workflows/speckit/*
  - templates/*
  - scripts/*
  - ide-adapters/*
  - extensions/*
  - integrations/*
  - spec-harness/memory-audit-checklist.md
  - .agents/skills/*
  - .codebuddy/skills/*
  - .codebuddy/commands/*
  - .trae/skills/*
  - packages/sovei-system/*