schema_version: 1
workflow_version: "1.1.0"
usage: "USAGE.md"
invocation:
  max_stages: 1
  chaining: forbidden
  skill_map: "skill-map.yaml"
  report_skills: true
control_actions: ["reopen"]
rework:
  history_artifact: "workflow-history.md"
  invalidation: "target_and_successors"
stage_order:
  - load
  - grill
  - wayfind
  - spec
  - scope
  - plan
  - tasks
  - implement
  - converge
  - verify
  - learn
  - sync
stages:
  load:
    status: active
    required_artifacts: []
    next: ["grill"]
  grill:
    status: active
    required_artifacts: ["decision-log.md"]
    next: ["wayfind", "spec"]
  wayfind:
    status: active
    required_artifacts: ["wayfinder.md"]
    next: ["spec"]
  spec:
    status: active
    required_artifacts: ["spec.md"]
    next: ["scope"]
  scope:
    status: active
    required_artifacts: ["scope.md", "coverage-matrix.md"]
    next: ["plan"]
  plan:
    status: active
    required_artifacts: ["plan.md"]
    next: ["tasks"]
  tasks:
    status: active
    required_artifacts: ["tasks.md"]
    next: ["implement"]
  implement:
    status: active
    required_artifacts: ["change-manifest.md"]
    next: ["converge"]
  converge:
    status: active
    required_artifacts: ["convergence-report.md"]
    next: ["verify"]
  verify:
    status: active
    required_artifacts: ["evidence.md"]
    next: ["learn"]
  learn:
    status: active
    required_artifacts: ["learning-report.md"]
    next: ["sync"]
  sync:
    status: active
    required_artifacts: ["sync-report.md"]
    next: []
